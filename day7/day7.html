<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
        flex box 
        it is a one dimensional layout model that is used
        to create web layouts

        
        flex-items(child)
        
        flex-container(parent)
        1) display:flex
        it is used to create flex box -it will change the direction of childs into
        single row

        .parent{
        display:flex;
        }

        2) gap
        it is used to create the space
        gap:20px;

        3) flex-direction
        it is used to control the child directions
          flex-direction:column;
        flex-direction:column-reverse;
        flex-direction:row-reverse;
        flex-direction:row;---by default


        4) justify-content
        it is used to contrl the alignment of child items on main axis
 justify-content:center;
        justify-content:end;
        justify-content:space-evenly;
        justify-content:space-around;
        justify-content:space-between;
        justify-content:start;

        5) align-items
        it is used to align the items on cross axis

        */

         .parent{
        height:80vh;
        border:2px solid blue;
        display:flex;
        gap:10px;
        flex-direction:column;
        flex-direction:column-reverse;
        flex-direction:row-reverse;
        flex-direction:row;
        justify-content:center;
        justify-content:end;
        justify-content:space-evenly;
        justify-content:space-around;
        justify-content:space-between;
        justify-content:start;
        align-items:start;
        align-items:center;
        align-items:end;
        align-items:stretch;
        
        }
        .child{
            background:lightsalmon;
            padding:20px;
            width:200px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child">child 1</div>
        <div class="child">child 2</div>
        <div class="child">child 3</div>
    </div>
    
</body>
</html>
