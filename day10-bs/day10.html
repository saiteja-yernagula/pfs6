     bootstrap - css framework
     it is a css framework that is used to build mobile first responsive webpages

     how to integrate bootstrap
     1) using cdn link
        search bootstrap 5 cdn
        copy css link in head section
        copy script link at the bottom of the body
        <div class='bg-primary'>content</div>
     2) using download
     3) npm install bootstrap

     html -tags
     css- properties

     <div class='bg-primary'>content</div>

 <div class='text-primary'>content</div>

        content
        w-25 or w-50 or 75 or 100
        h-25 or h-50 or 75 or 100

        padding
        p-1 to p-5
        px-1 to px-5
        py-1 to py-5
        pt-1 pe-2 pb-3 ps-4

        border
        border border-1 to border-5 
        border-contextual
        

        margin
          m-1 to m-5
        mx-1 to mx-5
        my-1 to my-5
        mt-1 me-2 mb-3 ms-4

        cards and buttons
        
        card   -div

        5) d-flex
           justify-content-end start center between around evenly
