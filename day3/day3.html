    <!-- 
    tags are divided based on behavior
    1) block level elements
    are the elements which occupies complete spacce and which always 
    starts on new line
    ex: h1,p,tabe,ul,ol

    2) inline elements
    are the elements which takes necessary space and doesnt starts on new line
    ex: a ,img


    div and span
    div is a block level elements used to form the group of elements for applying styles

    span
    it is a inline element user to form the group of text for apply styles

    <div style="background:lightcoral">

    forms
    forms are used to collect the data from the user and allowing user
    to submit data to the server
    login,signup pages,register,contact ,

    forms are defined with form tag
    form fields  are defined with input tag
    label tag and placeholder used to provide the hint\


    type-it will control the behavior of input
    name- it will carry the data to the backend as key value pairs
    for id - it will connect the label to the input
    required-it specifies that a field must contain something

    form
    method="GET"
    method="POST"

    formsubmit.co
  
    -->
    <form action="" method="POST">
        <label for="un">enter username:</label>
        <input id="un" type="text" name="uname" placeholder="username"> <br>
        <label for="pwd">enter password:</label>
        <input  id="pwd" type="password" name="password" placeholder="password"> <br>

        enter ur mail

        search your product
        <input type="search"><br>
        rate yourself

        <button type="submit">submit</button>
    </form>
